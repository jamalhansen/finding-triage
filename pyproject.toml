[project]
name = "finding-triage"
version = "0.1.0"
description = "Routes static-analysis findings to likely owners using git blame and a local LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "local-first-common",
    "typer>=0.15.0",
    "click<8.3.2",  # 8.3.2 breaks typer 0.24.1 option parsing (same pin as the rest of the fleet)
    "pydantic>=2.0",
]

[project.scripts]
finding-triage = "finding_triage.cli:app"

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
]
